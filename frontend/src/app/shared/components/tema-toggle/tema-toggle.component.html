<button type="button" class="ios-switch" role="switch"
        [attr.aria-checked]="tema.tema() === 'dark'"
        [attr.aria-label]="tema.tema() === 'dark' ? 'Modo noche activado. Cambiar a modo día' : 'Modo día activado. Cambiar a modo noche'"
        [title]="tema.tema() === 'dark' ? 'Modo noche' : 'Modo día'"
        (click)="tema.alternar()">
  <svg class="icon sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
  <svg class="icon moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z"/></svg>
  <span class="knob"></span>
</button>
