server:
  address: 127.0.0.1
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false
        same-site: lax
spring:
  application:
    name: portal-prohabit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prohabit}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  threads:
    virtual:
      enabled: true
app:
  uploads: ${UPLOAD_DIR:./uploads}
  admin-email: ${ADMIN_EMAIL:admin@prohabit.local}
  admin-password: ${ADMIN_PASSWORD:}
  seed-demo: ${SEED_DEMO:false}
logging:
  level:
    org.springframework.security: WARN
